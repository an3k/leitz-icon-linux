name: CUPS - Build
on:
  push:
    branches: [cups]
    paths:
      - 'requests/build.trigger'
  workflow_dispatch:
    inputs:
      driver:
        description: 'Leitz driver to integrate into the CUPS image'
        type: choice
        required: true
        default: main
        options:
          - none
          - main
          - dev
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout selected Debian CUPS source
        uses: actions/checkout@v4
        with:
          ref: cups
      - name: Select optional Leitz driver
        shell: bash
        env:
          DISPATCH_DRIVER: ${{ inputs.driver }}
        run: |
          mode=$DISPATCH_DRIVER
          if [[ -z "$mode" ]]; then
            mode=$(sed -n 's/^driver=//p' requests/build.trigger | tail -n 1)
            mode=${mode:-main}
          fi
          case "$mode" in
            none|main|dev) ;;
            *) echo "ERROR: Unsupported driver: $mode" >&2; exit 2 ;;
          esac
          echo "CUPS_DRIVER=$mode" >> "$GITHUB_ENV"
          echo "CUPS_DRIVER_REF=$([[ "$mode" == dev ]] && echo driver || echo main)" >> "$GITHUB_ENV"
      - name: Checkout optional Leitz driver
        if: env.CUPS_DRIVER != 'none'
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CUPS_DRIVER_REF }}
          path: release
      - name: Record driver revision
        if: env.CUPS_DRIVER != 'none'
        run: echo "RELEASE_SHA=$(git -C release rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and verify requested CUPS variant
        run: bash build/build.sh "$CUPS_DRIVER"
      - name: Publish separately loadable archive
        uses: actions/upload-artifact@v4
        with:
          name: leitz-icon-cups-${{ env.CUPS_DRIVER }}-image
          path: dist/
          retention-days: 30
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push selected CUPS image
        shell: bash
        run: |
          version=$(cat dist/cups-version.txt)
          mode=$(cat dist/cups-driver-mode.txt)
          driver_sha=$(cat dist/driver-commit.txt)
          version_tag=${version//+/_}
          case "$mode" in
            none) tag="none-cups-$version_tag" ;;
            main|dev) tag="$mode-${driver_sha:0:12}-cups-$version_tag" ;;
            *) exit 2 ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cups:$tag"
          docker tag leitz-cups-complete:build "$image"
          docker push "$image"
          echo "Published $image"
