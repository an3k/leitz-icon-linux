name: Build Unraid CUPS from archived Debian source and main driver
on:
  push:
    branches: [cups]
    paths:
      - 'requests/build.trigger'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout selected Debian CUPS source
        uses: actions/checkout@v4
        with:
          ref: cups
      - name: Checkout approved Leitz driver
        uses: actions/checkout@v4
        with:
          ref: main
          path: release
      - name: Record approved driver commit
        run: echo "RELEASE_SHA=$(git -C release rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Build and validate container
        run: bash build/build.sh
      - name: Publish loadable image
        uses: actions/upload-artifact@v4
        with:
          name: leitz-icon-unraid-cups-main-image
          path: dist/
          retention-days: 30
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish experimental image
        run: |
          version=$(cat dist/cups-version.txt)
          image_version=${version//+/_}
          image="ghcr.io/${GITHUB_REPOSITORY,,}-cups:main-${RELEASE_SHA:0:12}-cups-$image_version"
          docker tag leitz-cups-complete:build "$image"
          docker push "$image"
