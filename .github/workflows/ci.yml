name: Independent driver verification
on:
  push:
    branches: [tests]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify separately checked-out driver
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: tests
          path: suite
      - name: Checkout independent driver branch
        uses: actions/checkout@v4
        with:
          ref: driver
          path: product
      - name: Install compiler and CUPS development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3 libcups2-dev cups
      - name: Assemble temporary verification workspace
        run: cp -a suite/tests product/tests
      - name: Build unmodified driver source
        working-directory: product
        run: make clean all cups probe ppd
      - name: Run separate verification suite
        working-directory: product
        env:
          LEITZ_PROTOCOL_DIR: ${{ github.workspace }}/product/driver/modules
        run: make -f ../suite/Makefile verify
      - name: Verify branch separation
        run: |
          test ! -e product/tests/integration/../..//driver/driver
          test ! -e suite/driver
          test -d product/driver/src
          test -d suite/tests/integration

  cups-integration:
    name: Install driver into frozen unmodified CUPS source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout independent integration tests
        uses: actions/checkout@v4
        with:
          ref: tests
          path: suite
      - name: Checkout standalone development driver
        uses: actions/checkout@v4
        with:
          ref: driver
          path: product
      - name: Checkout frozen CUPS configuration
        uses: actions/checkout@v4
        with:
          ref: cups
          path: frozen
      - name: Install driver into clean original CUPS container
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash suite/tests/integration/test_installed_cups.sh
