name: Build approved baseline standalone CUPS driver
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CUPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make libcups2-dev cups
      - name: Compile and build driver-only archive
        run: bash install/package.sh
      - name: Validate legacy media and CUPS installation files
        run: |
          python3 build/check_media.py
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          cupstestppd -v cups/LeitzIcon.ppd
          bash -n cups/leitzusb cups/leitz-status install/*.sh
          mkdir -p /tmp/leitz-main-staged
          tar -xzf dist/leitz-icon-driver-main-linux-amd64.tar.gz -C /tmp/leitz-main-staged
          DESTDIR=/tmp/leitz-main-installed /tmp/leitz-main-staged/install.sh
          test -x /tmp/leitz-main-installed/usr/lib/cups/filter/leitz-rastertoicon
          test -x /tmp/leitz-main-installed/usr/lib/cups/backend/leitzusb
          test ! -e /tmp/leitz-main-installed/etc/cups
      - uses: actions/upload-artifact@v4
        with:
          name: leitz-main-standalone-driver
          path: dist/leitz-icon-driver-main-linux-amd64.tar.gz
          retention-days: 14
