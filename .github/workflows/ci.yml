name: Driver verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-tests:
    name: Build, unit tests, PPD validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install CUPS build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make libcups2-dev cups
      - name: Compile driver and independent raster mock
        run: make clean all cups mock-filter
      - name: Validate original tested raster reference and media cases
        run: |
          python3 tests/test_core.py
          python3 tests/test_v04.py
      - name: Validate driver PPD
        run: cupstestppd -v cups/LeitzIcon.ppd
      - name: Verify source package files
        run: |
          test -s cups/LeitzIcon.ppd
          test -s cups/leitzusb
          test -s cups/leitz-status
          test -s cups/entrypoint.sh
          bash -n cups/leitzusb cups/leitz-status cups/entrypoint.sh
      - name: Create reproducible source snapshot
        run: |
          mkdir -p dist
          tar --exclude='./.git' --exclude='./dist' --exclude='./tests/Windows-LeitzIcon.gpd' --exclude='./leitz-cli' --exclude='./leitz-rastertoicon' --exclude='./leitz-rastertoicon-mock' -czf dist/leitz-icon-linux-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: leitz-icon-linux-source
          path: dist/leitz-icon-linux-source.tar.gz
  container-image:
    name: Docker image build (no hardware access)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build independent CUPS container
        run: docker build -f cups/Dockerfile -t leitz-icon-cups:ci .
      - name: Check image includes the PPD
        run: |
          docker run --rm --entrypoint /bin/bash leitz-icon-cups:ci -ec '
            test -x /usr/lib/cups/filter/leitz-rastertoicon
            test -x /usr/lib/cups/filter/leitz-cli
            test -x /usr/lib/cups/backend/leitzusb
            test -s /usr/share/ppd/LeitzIcon.ppd
            cupstestppd /usr/share/ppd/LeitzIcon.ppd
          '
