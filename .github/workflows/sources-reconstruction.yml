name: Sources - Reconstruction Compile

on:
  push:
    branches: [sources]
    paths:
      - 'reconstructions/macos-5.1.465-classic/**'
      - 'verification/macos-5.1.465-classic/**'
      - 'originals/macos-5.1.465-classic/LeitzIcon.ppd'
      - '.github/workflows/sources-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classic-c-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GCC - compile and run isolated recovered C
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz clean all check CC=gcc
          make -C reconstructions/macos-5.1.465-classic/raster2printer clean all check CC=gcc
          make -C reconstructions/macos-5.1.465-classic/shared/diagnostics clean all check CC=gcc
          make -C verification/macos-5.1.465-classic clean_write_data check_write_data CC=gcc
      - name: Clang - compile and run isolated recovered C
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz clean all check CC=clang
          make -C reconstructions/macos-5.1.465-classic/raster2printer clean all check CC=clang
          make -C reconstructions/macos-5.1.465-classic/shared/diagnostics clean all check CC=clang
          make -C verification/macos-5.1.465-classic clean_write_data check_write_data CC=clang
      - name: Clean executable outputs
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz clean
          make -C reconstructions/macos-5.1.465-classic/raster2printer clean
          make -C reconstructions/macos-5.1.465-classic/shared/diagnostics clean
          make -C verification/macos-5.1.465-classic clean_write_data

  native-macos-classic:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build and run original-derived isolated C on macOS
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz clean all check CC=clang
          make -C reconstructions/macos-5.1.465-classic/raster2printer clean all check CC=clang
          make -C verification/macos-5.1.465-classic clean_write_data check_write_data CC=clang
      - name: Compile recovered dormant test-raster function with actual macOS CUPS SDK
        run: |
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations -c reconstructions/macos-5.1.465-classic/shared/diagnostics/original_test_raster.c -o "$RUNNER_TEMP/classic_test_raster.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations -c reconstructions/macos-5.1.465-classic/shared/diagnostics/original_page_debug.c -o "$RUNNER_TEMP/classic_page_debug.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-format-zero-length -Wno-deprecated-declarations -c reconstructions/macos-5.1.465-classic/shared/diagnostics/original_output_cups_info.c -o "$RUNNER_TEMP/classic_output_cups_info.o"
      - name: Compile classic command CUPS entry using Apple's SDK
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz command2leitz_recovered_cups CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
      - name: Compile ordinary classic raster CUPS entry using Apple SDK
        run: |
          make -C reconstructions/macos-5.1.465-classic/raster2printer classic_raster_cups_adapter CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_read_page.c \
            -o "$RUNNER_TEMP/classic_original_read_page.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_active_page_read.c \
            -o "$RUNNER_TEMP/classic_original_active_read.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_active_page_output.c \
            -o "$RUNNER_TEMP/classic_original_active_output.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_job_epilogue.c \
            -o "$RUNNER_TEMP/classic_original_job_epilogue.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_connected_job.c \
            -o "$RUNNER_TEMP/classic_original_connected_job.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_document_lifecycle.c \
            -o "$RUNNER_TEMP/classic_original_document_lifecycle.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_document_bridge.c \
            -o "$RUNNER_TEMP/classic_original_document_bridge.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_page_lifecycle.c \
            -o "$RUNNER_TEMP/classic_original_page_lifecycle.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_process_page_modes01.c \
            -o "$RUNNER_TEMP/classic_original_process_page_modes01.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_process_page_modes23.c \
            -o "$RUNNER_TEMP/classic_original_process_page_modes23.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_process_page_adapter.c \
            -o "$RUNNER_TEMP/classic_original_process_page_adapter.o"
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_dither_page.c \
            -o "$RUNNER_TEMP/classic_original_dither_page.o"
      - name: Compile joined OEM raster CUPS candidate against native Apple SDK
        run: |
          make -C reconstructions/macos-5.1.465-classic/raster2printer original_raster2printer_cups_candidate CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
      - name: Compile OEM CheckPrinterStatus original by-value descriptor ABI
        run: |
          clang -O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -c reconstructions/macos-5.1.465-classic/raster2printer/original_raster_native_status_entry_test.c \
            -o "$RUNNER_TEMP/checkprinterstatus_native_abi.o"
      - name: Confirm original raster utility entry points are linked
        run: |
          binary="reconstructions/macos-5.1.465-classic/raster2printer/original_raster2printer_cups_candidate"
          nm -g "$binary" > "$RUNNER_TEMP/oem-raster-linked-symbols.txt"
          # Original C++-private global symbols are present in nm but
          # are not assumed to be public exported functions.
          for name in __ZL16__libcpp_strrchrPKci __ZL15__libcpp_strstrPKcS0_; do
            nm "$binary" | grep -Fq " $name"
          done
          for name in __ZL7strrchrUa9enable_ifIXLb1EEEPKci __ZL6strstrUa9enable_ifIXLb1EEEPcPKc __ZL12_OSSwapInt16t; do
            nm "$binary" | grep -Fq " $name"
          done
          for name in __ZL4sock __ZL12resolved_uri __ZL8job_size __fd_stdout __fd_dump __fd_log; do
            nm "$binary" | grep -Eq "[[:space:]]$name$"
          done
          for name in _OpenLogFile _CloseLogFile _OpenDebugFile _CloseDebugFile _FlushDataStreams _is_bit_set _WriteDebugBuffer _SendDebugFileToPrinter _WriteData _CheckPrinterStatus _ResolveDeviceURI __Z14signal_handleri _ReadPage _StartDocument _EndDocument _DitherPage _StartPage _ProcessPage _EndPage _output_cups_info _test_raster _PrintPageDebugInfo; do
            grep -Eq "[[:space:]]$name$" "$RUNNER_TEMP/oem-raster-linked-symbols.txt"
          done
      - name: Confirm dormant OEM diagnostics are linked in command executable
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz command2leitz_original_main_candidate CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          binary="reconstructions/macos-5.1.465-classic/command2leitz/command2leitz_original_main_candidate"
          nm -g "$binary" > "$RUNNER_TEMP/oem-command-linked-symbols.txt"
          for name in _output_cups_info _test_raster _PrintPageDebugInfo _GetStatus _GetPrinterStatus _GetUnitedStatus _GetFirmvareVersion _EndOfJob _WriteData __fd_stdout __fd_dump __fd_log; do
            grep -Eq "[[:space:]]$name$" "$RUNNER_TEMP/oem-command-linked-symbols.txt"
          done
      - name: Build and execute OEM-derived URI resolver without a network connection
        run: |
          make -C reconstructions/macos-5.1.465-classic/raster2printer original_device_uri_test CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          reconstructions/macos-5.1.465-classic/raster2printer/original_device_uri_test
      - name: Verify original URI resolver TCP port behavior on loopback only
        run: |
          make -C reconstructions/macos-5.1.465-classic/raster2printer original_device_uri_loopback_test CC=clang CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          reconstructions/macos-5.1.465-classic/raster2printer/original_device_uri_loopback_test
      - name: Clean executable outputs
        run: |
          make -C reconstructions/macos-5.1.465-classic/command2leitz clean
          make -C reconstructions/macos-5.1.465-classic/raster2printer clean

  vendor-macos-reference:
    name: Inspect original 5.1.465 Mach-O on macOS
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Obtain and identify authentic Leitz installer from vendor
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/leitz-original"
          mkdir -p "$work/mounted"
          url="https://www.leitz.com/firmware/install/LeitzIconInstaller__1002__05010465__LeitzIconSoftware-Installer_5.1.465/dmg"
          curl --fail --location --retry 2 --connect-timeout 30 --max-time 240 \
            --output "$work/vendor.dmg" "$url"
          hdiutil attach -readonly -nobrowse -mountpoint "$work/mounted" "$work/vendor.dmg"
          echo "Installer package:"
          find "$work/mounted" -maxdepth 2 -print | head -40
          pkgutil --expand-full "$work/mounted/LeitzIconSoftware-Installer.mpkg" "$work/expanded"
          echo "Expanded package executables:"
          find "$work/expanded" -type f \( -name raster2printer -o -name command2leitz \) -print
          raster="$(find "$work/expanded" -type f -name raster2printer -print -quit)"
          command="$(find "$work/expanded" -type f -name command2leitz -print -quit)"
          test -n "$raster" && test -n "$command"
          echo "Original vendor SHA-256 values:"
          shasum -a 256 "$raster" "$command"
          test "$(shasum -a 256 "$raster" | awk '{print $1}')" = "72f1dfc66f755f9537330c1f0306828f4510ba3b44296a192d1ee8a2dec12c13"
          test "$(shasum -a 256 "$command" | awk '{print $1}')" = "6e43cae5e152d5e2d8e9e975d026375563afdffdadca08f835cb4c3a58d3f3ee"
          echo "Original binaries match the uploaded reference hashes."
          file "$raster" "$command"
          otool -L "$raster"
          otool -L "$command"
          echo "Complete original classic macOS symbol inventory:"
          echo "RASTER_ORIGINAL_SYMBOLS_BEGIN"
          nm -nm "$raster" | grep -F '(__TEXT,__text)' || true
          echo "RASTER_ORIGINAL_SYMBOLS_END"
          echo "COMMAND_ORIGINAL_SYMBOLS_BEGIN"
          nm -nm "$command" | grep -F '(__TEXT,__text)' || true
          echo "COMMAND_ORIGINAL_SYMBOLS_END"
          echo "Unrecovered original native function symbols:"
          nm -nm "$raster" "$command" | grep -E '(_ResolveDeviceURI|_CheckPrinterStatus|_WriteData|_OpenLogFile)' || true
          echo "Original command utility assembly: flush, bit test and output"
          otool -tvV "$command" | awk '
            /^_FlushDataStreams:$/ || /^_is_bit_set:$/ ||
            /^_WriteData:$/ || /^_CloseDebugFile:$/ ||
            /^_CloseLogFile:$/ { show=1; count=0; print; next }
            show && /^_[A-Za-z0-9_.$]+:$/ {show=0}
            show && count++ < 130 {print}
          '
          echo "Disassembly of unresolved raster functions (bounded output):"
          otool -tvV "$raster" | awk '
            /^_ResolveDeviceURI:$/ || /^_CheckPrinterStatus:$/ {
              show=1; count=0; print; next
            }
            show && /^_[A-Za-z0-9_.$]+:$/ { show=0 }
            show && count++ < 480 {print}
          '
          echo "Inspect original raster job-loop transitions before comparison:"
          python3 verification/macos-5.1.465-classic/audit_raster_transitions.py "$raster"
          echo "Compare OEM stdout with reconstructed raster output:"
          ppd="$GITHUB_WORKSPACE/originals/macos-5.1.465-classic/LeitzIcon.ppd"
          test -f "$ppd"
          make -C reconstructions/macos-5.1.465-classic/raster2printer \
            classic_raster_cups_adapter CC=clang \
            CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          clang -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations \
            -o "$work/cups-fixture" \
            verification/macos-5.1.465-classic/cups_fixture.c -lcups
          "$work/cups-fixture" "$work/input.ras"
          bash verification/macos-5.1.465-classic/compare_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Compile connected original-derived CUPS candidate for direct OEM comparison:"
          make -C reconstructions/macos-5.1.465-classic/raster2printer \
            original_raster2printer_cups_candidate CC=clang \
            CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          echo "Compare classic OEM command filter against recovered C:"
          bash verification/macos-5.1.465-classic/compare_command_with_vendor.sh \
            "$work" "$command" "$ppd"
          echo "Verify exact classic OEM command main diagnostics and error branches:"
          make -C reconstructions/macos-5.1.465-classic/command2leitz \
            command2leitz_original_main_candidate CC=clang \
            CFLAGS="-O2 -std=c11 -Wall -Wextra -Werror -Wno-deprecated-declarations"
          bash verification/macos-5.1.465-classic/compare_command_main_with_vendor.sh \
            "$work" "$command" "$ppd"
          echo "Compare connected original-derived command status queries against OEM:"
          bash verification/macos-5.1.465-classic/compare_connected_command_with_vendor.sh \
            "$work" "$command" "$ppd"

          echo "Compare original RGB24 dithering against recovered raster output:"
          "$work/cups-fixture" "$work/rgb.ras" rgb
          echo "Check original startup error paths against joined native CUPS reconstruction:"
          bash verification/macos-5.1.465-classic/compare_connected_startup_errors_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Compare complete original-derived connected stdout against OEM modes 2/3:"
          bash verification/macos-5.1.465-classic/compare_connected_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Compare joined native original RGB24 halftones across all remaining quality matrices:"
          bash verification/macos-5.1.465-classic/compare_connected_halftones_with_vendor.sh \
            "$work" "$raster" "$ppd"
          bash verification/macos-5.1.465-classic/compare_rgb_with_vendor.sh \
            "$work" "$raster" "$ppd" \
            "Bayer8x8SuperCell1 Bayer8x8SuperCell2 SuperCell1 SuperCell3 CUPSThresold64x64 SuperCell Bayer14x14 Clustered8x8 Dispersed8x8 Nasik4x4"
          echo "Compare defined bytes and full diagnostics in manufacturer mode 0:"
          for height in 33 80; do
            "$work/cups-fixture" "$work/mode0-mono-$height.ras" mono "$height"
            "$work/cups-fixture" "$work/mode0-rgb-$height.ras" rgb "$height"
          done
          bash verification/macos-5.1.465-classic/compare_connected_mode0_defined_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Verify original mode-1 RGB24 dithering and raw-row output with blank last row:"
          for height in 33 80; do
            "$work/cups-fixture" "$work/rgb-tailblank-$height.ras" rgbtailblank "$height"
          done
          bash verification/macos-5.1.465-classic/compare_mode1_rgb_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Verify joined OEM mode-1 mixed pixels with defined last-row reads:"
          for height in 33 80; do
            "$work/cups-fixture" "$work/tailblank-$height.ras" tailblank "$height"
          done
          bash verification/macos-5.1.465-classic/compare_mode1_mixed_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Verify joined reconstructed mode-1 all-white original CUPS jobs:"
          for height in 1 33 127; do
            "$work/cups-fixture" "$work/blank-$height.ras" blank "$height"
          done
          bash verification/macos-5.1.465-classic/compare_mode1_blank_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Check original variable-length and no-cut print paths:"
          "$work/cups-fixture" "$work/mono-33.ras" mono 33
          "$work/cups-fixture" "$work/mono-127.ras" mono 127
          bash verification/macos-5.1.465-classic/compare_variable_length.sh \
            "$work" "$raster" "$ppd"
          echo "Check genuine classic PrintThroughPRN transfer:"
          bash verification/macos-5.1.465-classic/compare_prn_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Check joined native OEM candidate on variable length and deferred PRN:"
          bash verification/macos-5.1.465-classic/compare_connected_extended_with_vendor.sh \
            "$work" "$raster" "$ppd"
          echo "Probe original macOS network channel on 127.0.0.1 only:"
          python3 verification/macos-5.1.465-classic/loopback_original_ipp.py \
            "$work" "$raster" "$ppd"
          echo "Compare original and joined native CUPS IPP-environment channels on loopback only:"
          python3 verification/macos-5.1.465-classic/compare_connected_ipp_loopback.py \
            "$work" "$raster" "$ppd"
