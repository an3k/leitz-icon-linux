name: Upgrade Debian Bookworm CUPS sources
on:
  push:
    branches: [cups]
    paths:
      - 'requests/upgrade.trigger'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cups-sources
  cancel-in-progress: false
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cups
          persist-credentials: true
      - name: Download and activate verified Debian CUPS sources
        run: bash build/upgrade.sh
