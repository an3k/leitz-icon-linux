name: Upgrade frozen upstream CUPS source
on:
  push:
    branches: [cups]
    paths:
      - '.github/workflows/upgrade.yml'
      - 'scripts/upgrade.sh'
      - 'cups/upstream.env'
      - 'requests/upgrade.trigger'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cups
      - name: Download, archive and unpack upstream only if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/upgrade.sh
