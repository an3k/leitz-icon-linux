name: Driver - Development Build
on:
  push:
    branches: [driver]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    name: Compile, validate and package standalone driver
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'driver' }}
      - name: Install compiler and CUPS development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3 libcups2-dev cups
      - name: Build complete driver package against Debian Bookworm ABI
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work debian:bookworm-slim \
            /bin/bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends gcc make python3 libcups2-dev
              bash install/package.sh
              (cd dist && sha256sum leitz-icon-driver-linux-amd64.tar.gz > leitz-icon-driver-linux-amd64.tar.gz.sha256)
            '
      - name: Verify package and installed PPD
        run: |
          python3 build/generate_media.py --check
          python3 build/check_vendor_controls.py
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          sudo install -m 0755 cups/leitz-command /usr/lib/cups/filter/leitz-command
          cupstestppd -v cups/LeitzIcon.ppd
          bash -n cups/leitzusb cups/leitz-status cups/leitz-command install/*.sh
          mkdir -p /tmp/leitz-package-test
          tar -xzf dist/leitz-icon-driver-linux-amd64.tar.gz -C /tmp/leitz-package-test
          DESTDIR=/tmp/leitz-package-installed /tmp/leitz-package-test/install.sh
          test -x /tmp/leitz-package-installed/usr/lib/cups/filter/leitz-rastertoicon
          test -x /tmp/leitz-package-installed/usr/lib/cups/backend/leitzusb
          test -f /tmp/leitz-package-installed/usr/lib/leitz/protocols/leitz-current.so
          test -f /tmp/leitz-package-installed/usr/share/ppd/LeitzIcon.ppd
          test ! -e /tmp/leitz-package-installed/etc/cups
      - name: Upload independent driver archive
        uses: actions/upload-artifact@v4
        with:
          name: leitz-icon-standalone-driver
          path: |
            dist/leitz-icon-driver-linux-amd64.tar.gz
            dist/leitz-icon-driver-linux-amd64.tar.gz.sha256
          retention-days: 30

  release:
    name: Publish explicitly requested development prerelease
    if: ${{ github.event_name == 'push' }}
    needs: package
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Detect explicit release request in committed files
        id: request
        shell: bash
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -Fxq 'requests/release.trigger'; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'No explicit development release requested.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Download successfully built standalone driver package
        if: ${{ steps.request.outputs.publish == 'true' }}
        uses: actions/download-artifact@v4
        with:
          name: leitz-icon-standalone-driver
          path: dist
      - name: Validate the explicit release request and archive
        if: ${{ steps.request.outputs.publish == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          tag=$(sed -n 's/^tag=//p' requests/release.trigger | tail -n 1)
          [[ "$tag" =~ ^dev-v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]] || {
            echo "ERROR: Invalid development tag: $tag" >&2
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          (cd dist && sha256sum -c leitz-icon-driver-linux-amd64.tar.gz.sha256)
      - name: Publish development prerelease
        if: ${{ steps.request.outputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/leitz-icon-linux-${RELEASE_TAG}-source.tar.gz" \
            src cups media build install docs Makefile README.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "${RELEASE_TAG}" \
            dist/leitz-icon-driver-linux-amd64.tar.gz \
            dist/leitz-icon-driver-linux-amd64.tar.gz.sha256 \
            "dist/leitz-icon-linux-${RELEASE_TAG}-source.tar.gz" \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --generate-notes \
            --title "Leitz Icon Development Driver ${RELEASE_TAG}"
