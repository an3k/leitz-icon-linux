name: Driver - Development Release
on:
  push:
    tags:
      - 'dev-v*'
    branches:
      - driver
    paths:
      - 'requests/release.trigger'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check release version and driver origin
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin driver
          git merge-base --is-ancestor HEAD origin/driver || {
            echo 'ERROR: Only driver branch commits may be released' >&2
            exit 1
          }
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=$(sed -n 's/^tag=//p' requests/release.trigger | tail -n 1)
          fi
          [[ "$tag" =~ ^dev-v[0-9]+\.[0-9]+\.[0-9]+(-[a-z0-9.-]+)?$ ]] || {
            echo "ERROR: Invalid development release tag: $tag" >&2
            exit 1
          }
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
      - name: Install host CUPS validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends cups python3
      - name: Build standalone driver for Debian Bookworm
        run: |
          docker run --rm --volume "$PWD:/work" --workdir /work debian:bookworm-slim \
            /bin/bash -euc '
              apt-get update -qq
              apt-get install -y --no-install-recommends gcc make python3 libcups2-dev
              bash install/package.sh
              (cd dist && sha256sum leitz-icon-driver-linux-amd64.tar.gz > leitz-icon-driver-linux-amd64.tar.gz.sha256)
            '
      - name: Validate generated driver and installation archive
        shell: bash
        run: |
          set -euo pipefail
          python3 build/generate_media.py --check
          bash -n cups/leitzusb cups/leitz-status cups/leitz-command install/*.sh
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          sudo install -m 0755 cups/leitz-command /usr/lib/cups/filter/leitz-command
          cupstestppd -v cups/LeitzIcon.ppd
          (cd dist && sha256sum -c leitz-icon-driver-linux-amd64.tar.gz.sha256)
          mkdir -p /tmp/leitz-release-check
          tar -xzf dist/leitz-icon-driver-linux-amd64.tar.gz -C /tmp/leitz-release-check
          DESTDIR=/tmp/leitz-release-installed /tmp/leitz-release-check/install.sh
          test -x /tmp/leitz-release-installed/usr/lib/cups/filter/leitz-rastertoicon
          test -x /tmp/leitz-release-installed/usr/lib/cups/backend/leitzusb
          test -s /tmp/leitz-release-installed/usr/share/ppd/LeitzIcon.ppd
          test -s /tmp/leitz-release-installed/usr/lib/leitz/protocols/leitz-current.so
          test -s /tmp/leitz-release-installed/usr/lib/leitz/protocols/leitz-native.so
          test ! -e /tmp/leitz-release-installed/etc/cups
      - name: Prepare source archive and release checksums
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "dist/leitz-icon-linux-${RELEASE_TAG}-source.tar.gz" \
            src cups media build install docs Makefile README.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish development prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${RELEASE_TAG}" \
            dist/leitz-icon-driver-linux-amd64.tar.gz \
            dist/leitz-icon-driver-linux-amd64.tar.gz.sha256 \
            "dist/leitz-icon-linux-${RELEASE_TAG}-source.tar.gz" \
            dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --prerelease --generate-notes \
            --title "Leitz Icon Development Driver ${RELEASE_TAG}"
