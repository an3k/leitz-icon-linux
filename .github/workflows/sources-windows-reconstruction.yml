name: Sources - Windows 2018 Reconstruction

on:
  push:
    branches: [sources]
    paths:
      - 'reconstructions/windows-2018/**'
      - 'analysis/windows-2018/**'
      - '.github/workflows/sources-windows-reconstruction.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-static-c-recovery:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: GCC and Clang - offline Windows OEM raster fragment regressions
        run: sh reconstructions/windows-2018/LeitzRp/test.sh
      - name: GCC and Clang - offline Windows OEM language monitor status regressions
        run: sh reconstructions/windows-2018/LeitzLm/test.sh
      - name: GCC and Clang - bounded XML replies (Expat)
        run: |
          set -eu
          if ! pkg-config --exists expat; then
            sudo apt-get update
            sudo apt-get install -y libexpat1-dev pkg-config
          fi
          cd reconstructions/windows-2018/WiFiHTTP
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -O2 \
              wifi_xml.c wifi_xml_test.c -lexpat -o /tmp/leitz-wifi-xml
            /tmp/leitz-wifi-xml
          done
      - name: GCC and Clang - offline Windows PrintHelper DEVMODE regressions
        run: sh reconstructions/windows-2018/PrintHelper/test.sh
      - name: GCC and Clang - original Windows AddPrinter HTTP WiFi offline vectors
        run: |
          set -eu
          cd reconstructions/windows-2018/WiFiHTTP
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -O2 wifi_http.c wifi_http_test.c -o /tmp/leitz-wifi-http-test
            /tmp/leitz-wifi-http-test
          done
      - name: GCC and Clang - managed OEM WiFi security / scan / form parity vectors
        run: |
          set -eu
          cd reconstructions/windows-2018/WiFiHTTP
          for cc in gcc clang; do
            "$cc" -std=c11 -Wall -Wextra -Werror -pedantic -O2 wifi_managed.c wifi_managed_test.c -o /tmp/leitz-wifi-managed-test
            /tmp/leitz-wifi-managed-test
          done
      - name: Python - Windows application XML and GPD inventory regression
        run: python3 -m unittest discover -s analysis/windows-2018 -p 'test_inventory_windows_label_sizes.py' -v
