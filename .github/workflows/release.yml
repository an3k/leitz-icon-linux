name: Publish tagged standalone Linux driver
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3 libcups2-dev cups
      - name: Build standalone driver archive
        run: |
          bash install/package.sh
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          cupstestppd -v cups/LeitzIcon.ppd
          bash -n cups/leitzusb cups/leitz-status install/*.sh
      - name: Prepare signed-off source archive and checksums
        run: |
          tar -czf "dist/leitz-icon-linux-${GITHUB_REF_NAME}-source.tar.gz" driver Makefile README.md
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --prerelease --generate-notes \
            --title "Leitz Icon standalone driver ${GITHUB_REF_NAME} (experimental)"
