name: Build downloadable prerelease

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler and CUPS verification utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make libcups2-dev cups
      - name: Compile and validate driver source
        run: |
          make clean all cups mock-filter
          make media-check native-reference-test status-test probe-test
          python3 tests/test_core.py
          python3 tests/test_v04.py
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          cupstestppd -v cups/LeitzIcon.ppd
          bash -n cups/leitzusb cups/leitz-status cups/entrypoint.sh
      - name: Build a standalone CUPS container image
        run: docker build -f cups/Dockerfile -t "leitz-icon-cups:${GITHUB_REF_NAME}" .
      - name: Verify Docker image and export loadable release archive
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/bash "leitz-icon-cups:${GITHUB_REF_NAME}" -ec '
            test -x /usr/lib/cups/filter/leitz-rastertoicon
            test -x /usr/lib/cups/backend/leitzusb
            cupstestppd /usr/share/ppd/LeitzIcon.ppd
          '
          mkdir -p dist
          docker save "leitz-icon-cups:${GITHUB_REF_NAME}" | gzip -1 > "dist/leitz-icon-cups-${GITHUB_REF_NAME}-docker-image.tar.gz"
          tar --exclude='./.git' --exclude='./dist' --exclude='./leitz-cli' --exclude='./leitz-rastertoicon' --exclude='./leitz-rastertoicon-mock' --exclude='./leitz-probe' -czf "dist/leitz-icon-linux-${GITHUB_REF_NAME}-source.tar.gz" .
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish explicit experimental prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --prerelease --generate-notes \
            --title "Leitz Icon Linux ${GITHUB_REF_NAME} (experimental)"
