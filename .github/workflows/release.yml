name: Publish tagged standalone main driver
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make libcups2-dev cups
      - run: bash install/package.sh
      - name: Validate driver archive
        run: |
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          cupstestppd cups/LeitzIcon.ppd
          tar -tzf dist/leitz-icon-driver-main-linux-amd64.tar.gz
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS \
            --target "$GITHUB_SHA" --prerelease --generate-notes \
            --title "Leitz Icon driver $GITHUB_REF_NAME (experimental)"
