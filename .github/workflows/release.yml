name: Publish tagged Linux driver
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3 libcups2-dev cups
      - name: Build production components
        run: |
          make clean all cups probe ppd
          sudo install -m 0755 leitz-rastertoicon /usr/lib/cups/filter/leitz-rastertoicon
          cupstestppd -v driver/cups/LeitzIcon.ppd
          bash -n driver/cups/leitzusb driver/cups/leitz-status driver/cups/entrypoint.sh
      - name: Build Docker image
        run: |
          docker build -f driver/cups/Dockerfile -t "leitz-icon-cups:${GITHUB_REF_NAME}" .
          docker run --rm --entrypoint /bin/bash "leitz-icon-cups:${GITHUB_REF_NAME}" -ec '
            test -s /usr/lib/leitz/protocols/leitz-current.so
            test -s /usr/lib/leitz/protocols/leitz-native.so
            cupstestppd /usr/share/ppd/LeitzIcon.ppd
          '
      - name: Prepare source and image archives
        run: |
          mkdir -p dist
          docker save "leitz-icon-cups:${GITHUB_REF_NAME}" | gzip -1 > "dist/leitz-icon-cups-${GITHUB_REF_NAME}-docker-image.tar.gz"
          tar -czf "dist/leitz-icon-linux-${GITHUB_REF_NAME}-source.tar.gz" driver Makefile README.md
          cd dist
          sha256sum *.tar.gz > SHA256SUMS
      - name: Publish experimental prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.tar.gz dist/SHA256SUMS \
            --target "${GITHUB_SHA}" --prerelease --generate-notes \
            --title "Leitz Icon Linux ${GITHUB_REF_NAME} (experimental)"
