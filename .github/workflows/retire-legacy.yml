name: Retire archived development branch
on:
  push:
    branches: [tests]
permissions:
  contents: write
jobs:
  retire:
    name: Delete fully preserved legacy branch
    runs-on: ubuntu-24.04
    steps:
      - name: Verify immutable legacy head and remove obsolete ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          old=$(gh api "repos/$repo/git/ref/heads/port/vendor-parity" --jq '.object.sha')
          test "$old" = 'd692a0a546888ff358b4dd6267a9b76af94eecfa'
          gh api --method DELETE "repos/$repo/git/refs/heads/port/vendor-parity"
          echo 'Retired port/vendor-parity after verified preservation in driver and tests.'
