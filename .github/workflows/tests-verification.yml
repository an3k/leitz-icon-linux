name: Tests - Verification
on:
  push:
    branches: [tests]
  workflow_run:
    workflows: ['Driver - Development Build']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  revisions:
    if: ${{ github.event_name != 'workflow_run' || (github.event.workflow_run.head_branch == 'driver' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-24.04
    outputs:
      tests: ${{ steps.pin.outputs.tests }}
      driver: ${{ steps.pin.outputs.driver }}
      cups: ${{ steps.pin.outputs.cups }}
    steps:
      - id: pin
        name: Pin all independent branch commits
        shell: bash
        env:
          EVENT_TYPE: ${{ github.event_name }}
          PUSH_SHA: ${{ github.sha }}
          TRIGGER_DRIVER_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          remote="https://github.com/$GITHUB_REPOSITORY.git"
          resolve() { git ls-remote "$remote" "refs/heads/$1" | cut -f1; }
          tests=$(resolve tests)
          driver=$(resolve driver)
          cups=$(resolve cups)
          if [[ "$EVENT_TYPE" == push ]]; then tests=$PUSH_SHA; fi
          if [[ "$EVENT_TYPE" == workflow_run ]]; then driver=$TRIGGER_DRIVER_SHA; fi
          for value in "$tests" "$driver" "$cups"; do
            [[ "$value" =~ ^[a-f0-9]{40}$ ]] || exit 1
          done
          {
            echo "tests=$tests"
            echo "driver=$driver"
            echo "cups=$cups"
          } >> "$GITHUB_OUTPUT"
          echo "Verification commits: tests=$tests driver=$driver cups=$cups"
  verify:
    needs: revisions
    name: Verify separately checked-out driver
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revisions.outputs.tests }}
          path: suite
      - name: Checkout independent driver branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revisions.outputs.driver }}
          path: product
      - name: Install compiler and CUPS development headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc make python3 libcups2-dev cups
      - name: Assemble temporary verification workspace
        run: |
          mkdir -p product/tests
          cp -a suite/integration suite/unit suite/mocks product/tests/
      - name: Build unmodified driver source
        working-directory: product
        run: make clean all cups probe ppd
      - name: Run separate verification suite
        working-directory: product
        env:
          LEITZ_PROTOCOL_DIR: ${{ github.workspace }}/product/modules
        run: make -f ../suite/Makefile verify
      - name: Verify branch separation
        run: |
          test ! -e suite/driver
          test -d product/src
          test -d suite/integration

  cups-integration:
    needs: revisions
    name: Install development driver into verified Debian CUPS image
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout independent integration tests
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revisions.outputs.tests }}
          path: suite
      - name: Checkout standalone development driver
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revisions.outputs.driver }}
          path: product
      - name: Checkout versioned Debian CUPS sources
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.revisions.outputs.cups }}
          path: frozen
      - name: Ensure Debian source tooling is present
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends dpkg-dev gnupg gpgv
      - name: Install development driver into source-built Debian CUPS container
        run: bash suite/integration/test_installed_cups.sh
